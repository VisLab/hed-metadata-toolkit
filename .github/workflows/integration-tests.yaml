name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      python-version:
        description: 'Python version to test'
        required: false
        default: '3.12'
        type: choice
        options:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'

permissions:
  contents: read
  id-token: write

jobs:
  integration:
    name: Run Integration Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ inputs.python-version || '3.12' }}
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Create virtual environment
        run: |
          uv venv --clear .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      # Install dependencies
      - name: Install dependencies
        run: uv pip install -e ".[test]"

      # Run integration tests
      - name: Run integration tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m pytest tests/integration/ --integration -v

      # Print rate limit info
      - name: Check rate limits
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "Integration tests completed. Rate limits are tracked per-organization."
          echo "GitHub API (REST): https://api.github.com/rate_limit"
          echo "GraphQL API: Included in test output above"
