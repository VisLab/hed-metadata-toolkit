[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hed-metadata-toolkit"
version = "0.1.0"
description = "Shared toolkit for HED metadata repos: cache, API clients, citation identity, GitHub-org pipelines."
authors = [
    { name = "HED Group", email = "hedannotation@gmail.com" },
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "pandas>=1.5.0",
]

[project.optional-dependencies]
# PDF -> Markdown conversion (hed-convert-pdfs). Heavy; opt-in only.
pdf = [
    "marker-pdf",
]
test = [
    "pytest>=8.0.0",
]
docs = [
    "mdformat>=0.7.0",
    "mdformat-myst>=0.1.5",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "mdformat>=0.7.0",
    "mdformat-myst>=0.1.5",
]

[project.scripts]
# Pipeline steps, exposed as console commands so consumer repos
# (nemar-metadata, task-research) invoke the shared implementation
# directly instead of vendoring wrapper scripts.
# GitHub-org pipeline
hed-fetch-repo-list        = "hed_metadata_toolkit.github.fetch_repo_list:main"
hed-sync-repo-contents     = "hed_metadata_toolkit.github.sync_repo_contents:main"
hed-sync-local-files       = "hed_metadata_toolkit.github.sync_local_files:main"
hed-sync-repo-file-contents = "hed_metadata_toolkit.github.sync_repo_file_contents:main"
hed-list-event-files       = "hed_metadata_toolkit.github.list_event_files:main"
# Dataset-summary builders
hed-extract-summary-info   = "hed_metadata_toolkit.dataset_summary.extract_summary_info:main"
hed-extract-readme-summaries = "hed_metadata_toolkit.dataset_summary.extract_readme_summaries:main"
hed-update-summary         = "hed_metadata_toolkit.dataset_summary.update_summary:main"
hed-sort-datasets          = "hed_metadata_toolkit.dataset_summary.sort_datasets:main"
# Citation pipeline
hed-collect-citations      = "hed_metadata_toolkit.citations.collect_citations:main"
hed-assign-citation-ids    = "hed_metadata_toolkit.citations.assign_citation_ids:main"
hed-generate-review-queue  = "hed_metadata_toolkit.citations.generate_review_queue:main"
hed-apply-manual-fills     = "hed_metadata_toolkit.citations.apply_manual_fills:main"
hed-enrich-pub-ids         = "hed_metadata_toolkit.citations.enrich_pub_ids:main"
hed-convert-pdfs           = "hed_metadata_toolkit.citations.convert_pdfs:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# 120, not ruff's default of 88. Changing this reformats most of src/ in one
# diff, so do it alone rather than mixed into other work.
line-length = 120

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by ruff format
    "N802",  # camelCase test methods (legacy convention)
    "N803",  # non-lowercase argument names (scientific code)
    "N806",  # non-lowercase variables in functions (scientific code)
]

# Allow unused imports in __init__.py files
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["hed_metadata_toolkit"]

[tool.ruff.format]
# Ruff format settings
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
# LF, not "auto". This repo is developed on Windows and "auto" lets the
# formatter preserve CRLF, which is the bug .gitattributes exists to catch.
line-ending = "lf"

[tool.pytest.ini_options]
# Pytest configuration
minversion = "8.0"
testpaths = ["tests"]
addopts = "-v --tb=short"
# --integration flag is defined in tests/integration/conftest.py

